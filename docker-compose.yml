services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fitness-ai-dashboard
    ports:
      - "8081:8081"
    environment:
      - FITNESS_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

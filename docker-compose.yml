services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fitness-ai-dashboard
    ports:
      - "8081:8081"
    environment:
      - FITNESS_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
